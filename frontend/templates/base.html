<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexATS — AI-Native Applicant Tracking System</title>
    
    <script>(function () { var t = localStorage.getItem('ds_theme'); if (t === 'light') document.documentElement.classList.remove('dark'); else document.documentElement.classList.add('dark'); })();</script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    fontFamily: { 
                        sans: ['Plus Jakarta Sans', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'],
                        display: ['Plus Jakarta Sans', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    }
                } 
            } 
        }
    </script>

    <style>
        :root {
            --g-brand: #7c3aed;  /* Violet 600 */
        }
        
        body {
            background-color: #fafafa;
            color: #111827;
            transition: background-color 0.3s, color 0.3s;
        }
        html.dark body {
            background-color: #050d1e;
            color: #f3f4f6;
        }

        .g-divider {
            border-color: #e5e7eb;
        }
        html.dark .g-divider {
            border-color: rgba(255,255,255,0.08);
        }

        .g-sub-text {
            color: #6b7280;
        }
        html.dark .g-sub-text {
            color: #9ca3af;
        }

        .g-btn {
            background-color: var(--g-brand);
            color: white;
            transition: all 0.2s;
            text-align: center;
            display: inline-block;
        }
        html.dark .g-btn {
            background-color: rgba(167, 139, 250, 0.15); /* Brand 400 */
            color: #c4b5fd; /* Brand 300 */
            border: 1px solid rgba(167, 139, 250, 0.3);
        }
        html.dark .g-btn:hover {
            background-color: rgba(167, 139, 250, 0.25);
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.2);
        }

        .g-input {
            width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1px solid #e5e7eb;
            background: #fff; font-size: 0.9rem; transition: all 0.2s; color: #111827;
        }
        .g-input:focus { outline: none; border-color: var(--g-brand); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1); }
        html.dark .g-input {
            background: #0b1630; border-color: rgba(255, 255, 255, 0.08); color: #f3f4f6;
        }
        html.dark .g-input:focus { border-color: #a78bfa; box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15); }

        .hero-section {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 4rem;
            align-items: center;
            padding: 1.5rem 0 3rem;
        }
        @media(max-width:960px) {
            .hero-section {
                grid-template-columns: 1fr;
                gap: 3rem;
                padding: 1rem 0;
            }
        }

        .hero-grad {
            background: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        html.dark .hero-grad {
            background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Mesh grid background simulation */
        .grid-bg-light {
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        html.dark .grid-bg-light {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .logo-text {
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        /* Drop overrides for Bento */
        .bento-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .bento-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
        html.dark .bento-card {
            background: rgba(11, 22, 48, 0.5); /* Matching docshift dark tiles */
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        html.dark .bento-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(167, 139, 250, 0.3);
        }
    </style>
</head>

<body class="grid-bg-light">
    <!-- Navbar -->
    <header class="site-nav sticky top-0 z-50 bg-white/80 dark:bg-[#050d1e]/80 backdrop-blur-md border-b g-divider shadow-[0_2px_15px_rgba(0,0,0,0.03)] dark:shadow-none">
        <div class="max-w-6xl mx-auto px-5 py-2.5 flex items-center justify-between">
            
            <div class="flex items-center gap-4">
                <!-- Logo -->
                <a href="{% url 'frontend:index' %}" class="flex items-center gap-2.5 group no-underline mr-4">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center font-mono font-black text-sm bg-brand-600 dark:bg-transparent dark:border dark:border-[rgba(167,139,250,.35)] text-white dark:text-[#c4b5fd] group-hover:scale-105 transition-transform">
                        NX
                    </div>
                    <span class="logo-text text-[1.1rem] text-gray-800 dark:text-[#e2f0ff] group-hover:text-brand-600 dark:group-hover:text-[#a78bfa] transition-colors">NexATS</span>
                </a>

                <!-- Nav Links -->
                <a href="{% url 'frontend:index' %}#features" class="text-xs font-bold text-gray-600 dark:text-[#c8dff5] hover:bg-gray-100 dark:hover:bg-white/5 px-3 py-1.5 rounded-full transition-all hidden sm:flex items-center gap-2 group">
                    <span class="w-5 h-5 flex items-center justify-center bg-gray-100 dark:bg-white/5 rounded-full text-[0.65rem] group-hover:scale-110 transition-transform">✨</span>
                    Features
                </a>
                <a href="{% url 'frontend:pricing' %}" class="text-xs font-bold text-gray-600 dark:text-[#c8dff5] hover:bg-gray-100 dark:hover:bg-white/5 px-3 py-1.5 rounded-full transition-all hidden sm:flex items-center gap-2 group">
                    <span class="w-5 h-5 flex items-center justify-center bg-gray-100 dark:bg-white/5 rounded-full text-[0.65rem] group-hover:scale-110 transition-transform">🏷️</span>
                    Pricing
                </a>
            </div>

            <div class="flex items-center gap-2">
                {% if request.user.is_authenticated %}
                <a href="{% url 'frontend:dashboard' %}" class="g-btn px-5 py-2 rounded-full text-[0.82rem] font-semibold">
                    Dashboard
                </a>
                {% else %}
                <a href="{% url 'frontend:login' %}" class="text-sm font-bold text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white px-3 transition-colors hidden sm:inline-block">
                    Sign in
                </a>
                <a href="{% url 'frontend:signup' %}" class="g-btn px-5 py-2 rounded-full text-[0.82rem] font-semibold">
                    Get started
                </a>
                {% endif %}

                <!-- Theme toggle positioned at the absolute end of navbar -->
                <div class="pl-2 ml-2 border-l g-divider flex items-center">
                    <button onclick="dsToggleTheme()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-white/5 text-gray-500 dark:text-gray-400 transition-colors" id="theme-pill">
                        <span id="theme-icon">🌙</span>
                        <span id="theme-label" class="hidden">Dark</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1">

        {% block content %}{% endblock %}
        </main>

    <!-- Footer -->
    <footer class="border-t g-divider py-5 px-6 mt-4">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
            <span class="font-mono text-xs g-sub-text">&copy; 2026 NexATS. The System of Action.</span>
            <span class="font-mono text-xs g-sub-text">
                <a href="#" class="hover:underline text-gray-500 dark:text-gray-400">Terms</a> &middot;
                <a href="#" class="hover:underline text-gray-500 dark:text-gray-400">Privacy</a> &middot;
                <a href="{% url 'frontend:signup' %}" class="text-brand-600 dark:text-brand-400 font-semibold hover:underline">Sign up free</a>
            </span>
        </div>
    </footer>

    <script>
        function dsToggleTheme() {
            var d = document.documentElement.classList.contains('dark');
            if (d) { 
                document.documentElement.classList.remove('dark'); 
                localStorage.setItem('ds_theme', 'light'); 
            } else { 
                document.documentElement.classList.add('dark'); 
                localStorage.setItem('ds_theme', 'dark'); 
            }
            dsUpdateToggle();
        }
        function dsUpdateToggle() {
            var d = document.documentElement.classList.contains('dark');
            var i = document.getElementById('theme-icon');
            var l = document.getElementById('theme-label');
            if (i) i.textContent = d ? '🌙' : '☀️';
            if (l) l.textContent = d ? 'Dark' : 'Light';
        }
        dsUpdateToggle();
    </script>
</body>
</html>
