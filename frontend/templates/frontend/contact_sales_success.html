{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto px-5 py-32 text-center">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-brand-100 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 text-4xl mb-8 animate-bounce">
        <i class="ph-fill ph-check-circle"></i>
    </div>
    <h1 class="logo-text text-4xl text-gray-900 dark:text-white mb-6">Message Sent!</h1>
    <p class="text-lg g-sub-text mb-10 leading-relaxed">
        Thank you for your interest in our Enterprise solutions. A member of our sales team will contact you at your work email shortly.
    </p>
    <a href="{% url 'frontend:index' %}" class="inline-flex items-center gap-2 font-bold text-brand-600 dark:text-brand-400 hover:gap-3 transition-all">
        Back to Home <i class="ph-bold ph-arrow-right"></i>
    </a>
</div>
{% endblock %}
