{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto px-5 py-24">
    <div class="text-center mb-10">
        <h1 class="logo-text text-4xl text-gray-900 dark:text-white mb-4">Contact Sales</h1>
        <p class="g-sub-text">Fill out the form below and our enterprise team will reach out to you within 24 hours.</p>
    </div>

    <div class="bg-white dark:bg-[#0b1630] border g-divider rounded-3xl p-8 shadow-xl">
        <form method="POST">
            {% csrf_token %}
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Full Name</label>
                    <input type="text" name="name" required class="w-full px-4 py-3 rounded-xl border g-divider bg-gray-50 dark:bg-white/5 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Company Name</label>
                    <input type="text" name="company_name" required class="w-full px-4 py-3 rounded-xl border g-divider bg-gray-50 dark:bg-white/5 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Work Email</label>
                    <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border g-divider bg-gray-50 dark:bg-white/5 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Tell us about your needs</label>
                    <textarea name="message" required rows="4" class="w-full px-4 py-3 rounded-xl border g-divider bg-gray-50 dark:bg-white/5 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none transition-all"></textarea>
                </div>
                <button type="submit" class="g-btn w-full py-4 rounded-xl font-bold shadow-lg shadow-brand-500/20">
                    Send Request
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
