<a href="{% url 'jobs:detail' job.pk %}" data-id="{{ job.id }}" class="job-card dash-card p-3 group hover:-translate-y-1 hover:border-brand-500/50 transition flex flex-col outline-none overflow-hidden">
    
    <!-- Card Header -->
    <div class="card-header flex justify-between items-start mb-2">
        <div class="w-9 h-9 rounded-xl bg-brand-100 text-brand-600 dark:bg-brand-900/30 dark:text-brand-400 flex items-center justify-center shrink-0">
            <i class="ph-fill ph-briefcase text-lg"></i>
        </div>
        <div class="flex flex-col items-end gap-1">
            {% if job.status == 'ACTIVE' %}
                <span class="text-[0.6rem] font-black px-2 py-0.5 bg-green-100 text-green-700 dark:bg-green-500/10 dark:text-green-400 rounded-md">ACTIVE</span>
            {% elif job.status == 'DRAFT' %}
                <span class="text-[0.6rem] font-black px-2 py-0.5 bg-gray-100 text-gray-700 dark:bg-gray-800 dark:text-gray-300 rounded-md">DRAFT</span>
            {% else %}
                <span class="text-[0.6rem] font-black px-2 py-0.5 bg-red-100 text-red-700 dark:bg-red-500/10 dark:text-red-400 rounded-md">CLOSED</span>
            {% endif %}
            <span class="category-badge bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-300">{{ job.get_category_display }}</span>
        </div>
    </div>

    <!-- Card Body -->
    <div class="card-body">
        <h3 class="text-[0.8rem] font-bold text-gray-900 dark:text-white mb-0.5 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors line-clamp-1 truncate">{{ job.title }}</h3>
        <p class="description text-[0.7rem] g-sub-text line-clamp-1 mb-2 overflow-hidden">{{ job.description }}</p>
    </div>

    <!-- Card Footer -->
    <div class="card-footer pt-2 border-t g-divider flex items-center justify-between mt-auto">
        <div class="flex items-center gap-1.5 text-[0.65rem] font-bold text-gray-500 dark:text-gray-400">
            <i class="ph-fill ph-users text-xs"></i> {{ job.applications.count }} <span class="hidden sm:inline">Candidates</span>
        </div>
        <div class="text-[0.65rem] font-bold text-gray-400 dark:text-gray-600">
            {{ job.created_at|date:"M d" }}
        </div>
    </div>
    
</a>
